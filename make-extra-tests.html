function xorEncrypt(text, password) {
  const textBytes = new TextEncoder().encode(text);
  const keyBytes  = new TextEncoder().encode(password);
  const enc = new Uint8Array(textBytes.length);
  for (let i = 0; i < textBytes.length; i++)
    enc[i] = textBytes[i] ^ keyBytes[i % keyBytes.length];
  let bin = '';
  for (let i = 0; i < enc.length; i++) bin += String.fromCharCode(enc[i]);
  return btoa(bin);
}

function generate() {
  const pt3 = g3.map(b => b.join('\n')).join('\n\n');
  const pt4 = g4.map(b => b.join('\n')).join('\n\n');
  const enc3 = xorEncrypt(pt3, PW);
  const enc4 = xorEncrypt(pt4, PW);

  document.getElementById('results').style.display = 'block';
